<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mini-dashboard Rick & Morty</title>
  <style>
    body {

      background-color:white;
      font-family: Arial, sans-serif;
      /* max-width: 800px; */
      margin: 40px auto;
    }

    button {
      margin-right: 5px;
      background-color: black;
      color: white;
      border-radius: 5px;
    }
    #btn-Clear {
      background-color: white;
      color: black;
    }

    #status {
      background-color: rgb(196, 243, 224);
      border: solid white 2px;
      margin-top: 20px;
      padding: 10px;
      /* display: flex; */
      border-radius: 8px ;
      color: green;
      margin: 20px;
      /* gap: 20px; */

    }

  
/* 
    #status.error {
      background-color: #a82494;
      color: #8a1f11;
    } */

    #result {
      background-color: rgb(229, 229, 243);
      margin-top: 20px;
      display: flex;
      gap: 20px;
      border-radius: 8px ;
    }
    #fichaDatos{
      border: solid white 2px;
      padding: 10px;
      background-color:white;
      border-radius: 8px ;
    }
    /* #status.ok {
      background-color: #580b54;
      color: #216e21;
    }  */
    img {
      width: 150px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>Mini-dashboard: API Rick & Morty</h1>

  <p>ID personaje (1.826) <input type="number" id="characterId" placeholder="ID (1 - 826)">
  
  <!-- <br><br> -->

  <button id="btn-Callback">Buscar (Callback)</button>
  <button id="btn-Promises">Buscar (Promesas)</button>
  <button id="btn-Async">Buscar (Async/Await)</button>
  <button id="btn-Clear">Limpiar Resultados</button>
</p>

  <div id="status"></div>

<div id="fichaDatos">
 
  <div id="result"></div>
</div>
  <!-- JS externo -->
  <script src="prueba.js"></script>
</body>
</html>
